<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data: blob:; style-src 'self' app: 'unsafe-inline'; font-src 'self' app: data:; worker-src 'self' app: blob:; script-src 'self' app: 'wasm-unsafe-eval'">
  <title>PDF Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="toolbar"></div>
  <div id="formatbar"></div>
  <div id="main">
    <aside id="sidebar"></aside>
    <section id="viewer">
      <div id="pages"></div>
      <div id="welcome">
        <div class="welcome-box">
          <h1>PDF Studio</h1>
          <p>PDF の閲覧・注釈・編集・ページ整理・OCR・保護をこの PC 内で行います。</p>
          <div class="welcome-buttons">
            <button id="welcome-open" class="primary">PDF を開く…</button>
            <button id="welcome-create">ファイルから PDF を作成…</button>
            <button id="welcome-merge">複数のファイルを結合…</button>
            <button id="welcome-blank">空白の PDF</button>
            <button id="welcome-batch">一括処理…</button>
          </div>
          <p class="drop-hint">ここに PDF ファイルをドラッグ＆ドロップしても開けます</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
